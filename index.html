      function getStoredTheme() {
        try {
          return localStorage.getItem('terminal_theme') || 'light';
        } catch {
          return 'light';
        }
      }

      function setTheme(theme) {
        const nextTheme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', nextTheme);
        try {
          localStorage.setItem('terminal_theme', nextTheme);
        } catch {
          // Ignore localStorage errors
        }
        themeBtn.setAttribute('title', `Current theme: ${nextTheme} (Click to toggle)`);
        return nextTheme;
      }

      function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        return setTheme(current === 'dark' ? 'light' : 'dark');
      }

      // Initialize theme on load
      setTheme(getStoredTheme());

      // ======================================================================
      // Helper: Escape HTML to Prevent XSS
      // ======================================================================
      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      // ======================================================================

      const CONTACT_TEXT = `
<div class="section-header">Direct Contact</div>
<p>Kiran welcomes direct inquiries for custom website builds, speed audits, and white-label agency partnerships.</p>
<br>
<p>&bull; <strong>Email:</strong> <a href="mailto:hello@kiranm.in">hello@kiranm.in</a> <span class="text-muted">(Typical reply within 24 hours)</span></p>
<p>&bull; <strong>Main Portfolio:</strong> <a href="https://kiranm.in" target="_blank" rel="noopener noreferrer">https://kiranm.in</a></p>
<p>&bull; <strong>Interactive Brief Form:</strong> <a href="https://kiranm.in/contact" target="_blank" rel="noopener noreferrer">https://kiranm.in/contact</a></p>

      // ======================================================================
      // AI Assistant Integration (Workers AI via POST /api/chat)
      // ======================================================================
      async function handleAiCommand(question) {
        if (!question || !question.trim()) {
          appendResult(`
            <p class="text-warning">Usage: <span class="text-accent">ai &lt;question&gt;</span></p>
            <p class="text-muted">Example: <code>ai What is your experience with Shopify and WooCommerce?</code></p>
            <p class="text-muted">Example: <code>ai Can you optimize Core Web Vitals on an existing WordPress site?</code></p>
          `);
          return;
        }

        const trimmedQ = question.trim();
        const placeholder = document.createElement('div');
        placeholder.className = 'command-result output-entry';
        placeholder.innerHTML = `<span class="thinking-spinner"><span class="spinner-dot">●</span> Kiran AI is thinking...</span>`;
        historyEl.appendChild(placeholder);
        scrollToBottom();

        isWaitingForAi = true;
        inputEl.disabled = true;

        try {
          const res = await fetch('https://kiranm.in/api/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              messages: [{ role: 'user', content: trimmedQ }]
            })
          });

          if (!res.ok) {
            throw new Error(`Server returned HTTP ${res.status}`);
          }

          const data = await res.json();
          // Support both { reply } and { message } payload shapes
          const rawReply = data?.reply || data?.message || data?.response || 'No reply generated by assistant.';

          // Format markdown links [text](url) safely inside AI reply
          const formattedReply = escapeHtml(rawReply)
            .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|mailto:[^\s)]+|#[^\s)]+|\/[^\s)]*)\)/g, (match, label, url) => {
              const safeUrl = url.startsWith('/') ? `https://kiranm.in${url}` : (url.startsWith('#') ? `https://kiranm.in/${url}` : url);
              return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer">${label}</a>`;
            })
            .replace(/\n/g, '<br>');

          placeholder.innerHTML = `
            <div class="card-block">
              <p><span class="text-accent font-bold">Kiran AI Assistant:</span></p>
              <div style="margin-top: 4px;">${formattedReply}</div>
            </div>
          `;
        } catch (err) {
          placeholder.innerHTML = `
            <p class="text-error">&times; AI query failed: ${escapeHtml(err.message || 'Unable to connect to live AI endpoint.')}</p>
            <p class="text-muted">Direct inquiries can always be sent directly to <a href="mailto:hello@kiranm.in">hello@kiranm.in</a>.</p>
          `;
        } finally {
          isWaitingForAi = false;
          inputEl.disabled = false;
          inputEl.focus();
          scrollToBottom();
        }
      }

      // ======================================================================
      // Command Dispatcher
      // ======================================================================
      async function executeCommand(rawInput) {
        const trimmed = rawInput.trim();
        if (!trimmed) return;

        // Record in command history
        commandHistory.push(trimmed);
        historyIndex = commandHistory.length;

        // Echo typed command
        appendEcho(trimmed);

        const spaceIdx = trimmed.indexOf(' ');
        const cmd = (spaceIdx === -1 ? trimmed : trimmed.slice(0, spaceIdx)).toLowerCase();
        const args = spaceIdx === -1 ? '' : trimmed.slice(spaceIdx + 1).trim();

        switch (cmd) {
          case 'welcome':
            appendResult(WELCOME_BANNER);
            break;

          case 'help':
            appendResult(HELP_TEXT);
            break;

          case 'about':
            appendResult(ABOUT_TEXT);
            break;

          case 'stack':
            appendResult(STACK_TEXT);
            break;

          case 'work':
          case 'projects':
            appendResult(WORK_TEXT);
            break;

          case 'ai':
          case 'ask':
            await handleAiCommand(args);
            break;

          case 'theme': {
            const sub = args.toLowerCase();
            let targetTheme = '';
            if (sub === 'dark') {
              targetTheme = setTheme('dark');
            } else if (sub === 'light') {
              targetTheme = setTheme('light');
            } else if (!sub) {
              targetTheme = toggleTheme();
            } else {
              appendResult(`<p class="text-warning">Unknown theme option '${escapeHtml(sub)}'. Use: <span class="text-accent">theme light</span> or <span class="text-accent">theme dark</span>.</p>`);
              return;
            }
            appendResult(`<p class="text-success">&check; Switched terminal theme to <span class="font-bold">${targetTheme}</span>.</p>`);
            break;
          }

          case 'gui':
          case 'website':
          case 'web':
            appendResult(`<p class="text-accent">&rarr; Opening https://kiranm.in in a new tab...</p>`);
            window.open('https://kiranm.in', '_blank', 'noopener,noreferrer');
            break;

          case 'contact':
          case 'email':
            appendResult(CONTACT_TEXT);
            break;

          case 'clear':
          case 'cls':
            historyEl.innerHTML = '';
            break;

          default:
            appendResult(`
              <p class="text-error">command not found: ${escapeHtml(cmd)}</p>
              <p class="text-muted">Type <span class="text-accent">help</span> to view available commands.</p>
            `);
            break;
        }
      }

      // ======================================================================
      // Input & Keyboard Event Listeners
      // ======================================================================
      inputEl.addEventListener('keydown', (e) => {
        // Prevent action while waiting for AI response
        if (isWaitingForAi) {
          e.preventDefault();
          return;
        }

        // Enter: Execute command
        if (e.key === 'Enter') {
          const val = inputEl.value;
          inputEl.value = '';
          executeCommand(val);
          return;
        }

        // ArrowUp: Navigate history backwards
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (commandHistory.length === 0) return;
          if (historyIndex > 0) {
            historyIndex--;
            inputEl.value = commandHistory[historyIndex];
          }
          return;
        }

        // ArrowDown: Navigate history forwards
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (commandHistory.length === 0) return;
          if (historyIndex < commandHistory.length - 1) {
            historyIndex++;
            inputEl.value = commandHistory[historyIndex];
          } else {
            historyIndex = commandHistory.length;
            inputEl.value = '';
          }
          return;
        }

        // Tab: Autocomplete matching command names
        if (e.key === 'Tab') {
          e.preventDefault();
          const current = inputEl.value.trim().toLowerCase();
          if (!current) return;

          const matches = AVAILABLE_COMMANDS.filter((cmd) => cmd.startsWith(current));
          if (matches.length === 1) {
            inputEl.value = matches[0] + ' ';
          } else if (matches.length > 1) {
            appendEcho(inputEl.value);
            appendResult(`<p class="text-muted">${matches.join(' &nbsp;&middot;&nbsp; ')}</p>`);
          }
          return;
        }

        // Ctrl+L: Clear screen
        if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) {
          e.preventDefault();
          historyEl.innerHTML = '';
          return;
        }
      });

      // Focus input on click anywhere on terminal body (unless highlighting text)
      bodyEl.addEventListener('click', (e) => {
        // Don't steal focus if user clicked an anchor tag
        if (e.target && e.target.tagName === 'A') return;
        const selection = window.getSelection();
        if (!selection || selection.toString().length === 0) {
          inputEl.focus();
        }
      });

      // Titlebar buttons
      themeBtn.addEventListener('click', () => {
        toggleTheme();
      });

      btnClose.addEventListener('click', () => {
        historyEl.innerHTML = '';
        inputEl.focus();
      });

      btnMinimize.addEventListener('click', () => {
        historyEl.innerHTML = '';
        appendResult(WELCOME_BANNER);
        inputEl.focus();
      });

      btnExpand.addEventListener('click', () => {
        toggleTheme();
        inputEl.focus();
      });

      // ======================================================================
      // Boot Sequence (Auto-run 'welcome')
      // ======================================================================
      appendResult(WELCOME_BANNER);
      inputEl.focus();

    })();
  </script>
